<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1E3A8A" />
  <title>Suma de pagos · Club F10</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="iconos/favicon-32.png" />
  <link rel="apple-touch-icon" href="iconos/icono-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>
  <!-- PIN -->
  <section id="pantalla-pin" class="centro" hidden>
    <form class="caja" id="form-pin">
      <div class="marca"><img class="marca-logo" src="iconos/icono-192.png" alt="Escudo Club Deportivo F10" width="44" height="44" /><div><strong>Suma de pagos</strong><small>Club Deportivo F10</small></div></div>
      <label>PIN<input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" required /></label>
      <p class="error" id="pin-error" role="alert"></p>
      <button class="btn btn-principal" type="submit">Entrar</button>
    </form>
  </section>

  <div id="app" hidden>
    <header class="barra">
      <div class="marca"><img class="marca-logo" src="iconos/icono-192.png" alt="Escudo Club Deportivo F10" width="40" height="40" /><div><strong>Suma de pagos</strong><small>Club Deportivo F10</small></div></div>
      <button class="btn btn-principal btn-instalar" id="btn-instalar" hidden>Instalar app</button>
    </header>

    <main>
      <section class="total" aria-live="polite">
        <small id="total-titulo">Total de transferencias</small>
        <strong id="total">$0</strong>
        <span id="total-detalle">Todavía no hay comprobantes</span>
      </section>

      <div class="filtros">
        <label class="filtro">Ver
          <select id="filtro-fecha"><option value="">Todas las fechas</option></select>
        </label>
        <button class="btn btn-suave" id="btn-compartir" disabled>Compartir resumen</button>
      </div>

      <label class="agregar">
        <input type="file" id="archivos" accept="image/*" multiple />
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
        <span><b>Agregar comprobantes</b><small>Escoge una o varias fotos o capturas</small></span>
      </label>

      <ul class="lista" id="lista"></ul>

      <button class="btn btn-peligro btn-borrar" id="btn-borrar" hidden>Borrar todo y empezar de cero</button>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
